name: Pipeline Quotidien TEVIA & GREENO
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
jobs:
  pipeline:
    name: ETL Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}" >> .env
          echo "MINIO_PORT=${{ secrets.MINIO_PORT }}" >> .env
          echo "MINIO_USE_SSL=${{ secrets.MINIO_USE_SSL }}" >> .env
          echo "MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}" >> .env
          echo "MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}" >> .env
          echo "MINIO_BUCKET=${{ secrets.MINIO_BUCKET }}" >> .env
          echo "UPYA_USERNAME=${{ secrets.UPYA_USERNAME }}" >> .env
          echo "UPYA_PASSWORD=${{ secrets.UPYA_PASSWORD }}" >> .env
          echo "SURGE_DRIVE_FOLDER=${{ secrets.SURGE_DRIVE_FOLDER }}" >> .env
          echo "GOOGLE_CREDENTIALS_PATH=config/google_credentials.json" >> .env
          echo "GOOGLE_APPLICATION_CREDENTIALS=config/google_credentials.json" >> .env
          echo "GS_LOCATIONS_ID=${{ secrets.GS_LOCATIONS_ID }}" >> .env
          echo "GS_LOCATIONS_WS=liste" >> .env

      - name: Create Google credentials file
        run: |
          mkdir -p config
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > config/google_credentials.json

      - name: Bronze - Extraction contracts UPYA
        run: python bronze/upya/generic_extractor.py contracts

      - name: Bronze - Extraction payments UPYA
        run: python bronze/upya/generic_extractor.py payments

      - name: Bronze - Extraction assets UPYA
        run: python bronze/upya/generic_extractor.py assets

      - name: Bronze - Extraction clients UPYA
        run: python bronze/upya/generic_extractor.py clients

      - name: Bronze - Extraction agents UPYA
        run: python bronze/upya/generic_extractor.py agents

      - name: Bronze - Extraction deals UPYA
        run: python bronze/upya/generic_extractor.py deals

      - name: Silver - Chargement contracts UPYA
        run: python silver/upya/contracts_loader.py

      - name: Silver - Chargement payments UPYA
        run: python silver/upya/payments_loader.py

      - name: Silver - Chargement assets UPYA
        run: python silver/upya/generic_loader.py assets

      - name: Silver - Chargement clients UPYA
        run: python silver/upya/generic_loader.py clients

      - name: Silver - Chargement agents UPYA
        run: python silver/upya/generic_loader.py agents

      - name: Silver - Chargement deals UPYA
        run: python silver/upya/generic_loader.py deals

      - name: Silver - Chargement locations (Google Sheets)
        run: python locations_upsert_etl.py

      # Rafraîchit la vue matérialisée de l'app de recouvrement (AppSheet).
      # Placé juste après le dernier chargement Silver : gold.unified_contracts
      # et gold.unified_transactions lisent Silver, elles sont donc à jour ici.
      # Placé AVANT le snapshot : si le snapshot échoue, l'app reçoit quand
      # même les données du jour.
      - name: Recouvrement - Rafraichissement mv_contrats
        run: |
          python -c "
          import sys, time
          sys.path.append('.')
          from dotenv import load_dotenv
          from database.db_client import get_db_connection
          load_dotenv()
          debut = time.time()
          conn = get_db_connection()
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute('SELECT recouvrement.rafraichir();')
          cur.execute('SELECT COUNT(*), MAX(rafraichi_le) FROM recouvrement.mv_contrats;')
          nb, quand = cur.fetchone()
          cur.close(); conn.close()
          print(f'mv_contrats rafraichie : {nb} contrats, photo du {quand}, {time.time() - debut:.1f}s')
          "

      - name: Gold - Snapshot quotidien unified_contracts
        run: python gold/snapshot_daily_contracts.py

      - name: Statut pipeline
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Pipeline termine avec succes"
          else
            echo "Pipeline a echoue - verifier les logs"
          fi